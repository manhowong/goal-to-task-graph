    <text x="211.11" y="310" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#000000">Task C</text>

    <circle cx="286.67" cy="90" r="28" fill="#ffffff" stroke="#888888" stroke-width="3"/>
    <text x="286.67" y="90" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#000000">Task D</text>

    <circle cx="362.22" cy="310" r="28" fill="#ffffff" stroke="#888888" stroke-width="3"/>
    <text x="362.22" y="310" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#000000">Task E</text>

    <circle cx="437.78" cy="90" r="28" fill="#ffffff" stroke="#888888" stroke-width="3"/>
