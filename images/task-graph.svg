    <circle cx="664.44" cy="310" r="28" fill="#ffffff" stroke="#888888" stroke-width="3"/>
    <text x="664.44" y="310" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#000000">Task I</text>

    <circle cx="740" cy="200" r="28" fill="#ffffff" stroke="#888888" stroke-width="3"/>
    <text x="740" y="200" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#000000">Task J</text>
